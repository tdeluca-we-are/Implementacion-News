// ══ DATOS ═══════════════════════════════════════════════════════════════════
// Dos implementaciones con la misma forma: Supabase y una demo en memoria para
// mostrar el hub sin cuenta (no guarda nada).
function apiSupabase(){
  const sb = supabase.createClient(SB_URL, SB_ANON);
  const q = async p => { const r = await p; if (r.error) throw r.error; return r.data; };
  async function todo(tabla, cols = '*', orden){ let out = [], pag = 0; for(;;){ let x = sb.from(tabla).select(cols); if (orden) x = x.order(orden.col, {ascending: orden.asc}); const d = await q(x.range(pag * 1000, pag * 1000 + 999)); out = out.concat(d); if (d.length < 1000) return out; pag++; } }
  return {
    demo: false,
    async sesion(){ return (await sb.auth.getSession()).data.session; },
    async entrar(email, password){ const r = await sb.auth.signInWithPassword({email, password}); if (r.error) throw r.error; },
    salir: () => sb.auth.signOut(),
    async vincular(){ const r = await sb.rpc('nws_vincular'); if (r.error) throw r.error; return (r.data || [])[0] || null; },
    marcas: () => todo('sem_marcas', 'id,nombre,activa', {col:'nombre', asc:true}),
    usuarioMarcas: () => todo('nws_usuario_marcas'),
    usuarios: () => todo('nws_usuarios', '*', {col:'nombre', asc:true}),
    configs: () => todo('nws_cliente_config'),
    news: () => todo('nws_news', 'id,marca_id,nombre,fecha_envio,hora_envio,estado,n_errores,n_avisos,actualizado_por,actualizado_at', {col:'actualizado_at', asc:false}),
    async newsUna(id){ return (await q(sb.from('nws_news').select('*').eq('id', id)))[0] || null; },
    async crearNews(fila){ return (await q(sb.from('nws_news').insert(fila).select()))[0]; },
    async guardarNews(id, cambios){ return (await q(sb.from('nws_news').update(cambios).eq('id', id).select()))[0]; },
    eventos: id => q(sb.from('nws_eventos').select('*').eq('news_id', id).order('en', {ascending:false}).limit(50)),
    async guardarConfig(fila){ return (await q(sb.from('nws_cliente_config').upsert(fila).select()))[0]; },
    async subir(path, file){ await q(sb.storage.from(BUCKET).upload(path, file, {upsert:false, contentType:file.type})); return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; },
    async guardarUsuario(u){ return (await q(u.id ? sb.from('nws_usuarios').update(u).eq('id', u.id).select() : sb.from('nws_usuarios').insert(u).select()))[0]; },
    async marcasDeUsuario(uid, ids){ await q(sb.from('nws_usuario_marcas').delete().eq('usuario_id', uid)); if (ids.length) await q(sb.from('nws_usuario_marcas').insert(ids.map(m => ({usuario_id:uid, marca_id:m})))); },
  };
}

function apiDemo(){

  const db = {
    marcas: [{id:1, nombre:'Marca demo', activa:true}, {id:2, nombre:'Otra marca demo', activa:true}],

    ],
    usuarios: [{id:1, email:'demo@we-are.com.ar', nombre:'Usuario demo', rol:'admin', activo:true}],
    um: [], news: [], eventos: [], id: 1,
  };
  const evento = (n, accion, detalle) => db.eventos.unshift({id:Date.now(), news_id:n.id, marca_id:n.marca_id, en:ahora(), usuario:'Usuario demo', accion, detalle});
  return {
    demo: true,
    async sesion(){ return {demo:true}; }, async entrar(){}, async salir(){},
    async vincular(){ return db.usuarios[0]; },
    async marcas(){ return db.marcas; }, async usuarioMarcas(){ return db.um; }, async usuarios(){ return db.usuarios; },
    async configs(){ return db.configs; }, async news(){ return db.news.map(n => ({...n})); },
    async newsUna(id){ const n = db.news.find(x => x.id === id); return n ? structuredClone(n) : null; },
    async crearNews(f){ const n = {id:db.id++, estado:'borrador', input:{}, piezas:[], contenido:'piezas', n_errores:0, n_avisos:0, creado_at:ahora(), actualizado_at:ahora(), actualizado_por:'Usuario demo', ...f}; db.news.unshift(n); evento(n, 'creada'); return structuredClone(n); },
    async guardarNews(id, c){
      // Mismas reglas que el trigger de la base.
      const n = db.news.find(x => x.id === id); const antes = n.estado, huellaAntes = n.huella;
      Object.assign(n, c, {actualizado_at:ahora(), actualizado_por:'Usuario demo'});
      if (['aprobada','cargada'].includes(antes) && n.huella !== huellaAntes){ n.estado = n.n_errores ? 'borrador' : 'lista'; n.aprobado_por = n.aprobado_at = n.aprobado_huella = null; evento(n, n.estado, 'cambió el contenido: se cayó la aprobación'); return structuredClone(n); }
      if (['lista','aprobada'].includes(n.estado) && n.n_errores) { Object.assign(n, {estado:antes}); throw new Error('La news tiene errores de validación'); }
      if (n.estado === 'aprobada' && antes !== 'aprobada'){ if (n.aprobado_huella !== n.huella) throw new Error('La huella aprobada no es la actual'); n.aprobado_por = 'Usuario demo'; n.aprobado_at = ahora(); }
      if (n.estado === 'cargada' && antes !== 'cargada'){ if (antes !== 'aprobada') throw new Error('Solo se puede marcar como cargada una news aprobada'); n.cargado_por = 'Usuario demo'; n.cargado_at = ahora(); }
      if (n.estado !== antes) evento(n, n.estado); else if (n.huella !== huellaAntes) evento(n, 'editada');
      return structuredClone(n);
    },
    async eventos(id){ return db.eventos.filter(e => e.news_id === id); },
    async guardarConfig(f){ const i = db.configs.findIndex(c => c.marca_id === f.marca_id); if (i >= 0) db.configs[i] = f; else db.configs.push(f); return f; },
    async subir(_path, file){ return URL.createObjectURL(file); },
    async guardarUsuario(u){ if (!u.id){ u.id = db.usuarios.length + 1; db.usuarios.push(u); } else Object.assign(db.usuarios.find(x => x.id === u.id), u); return u; },
    async marcasDeUsuario(uid, ids){ db.um = db.um.filter(x => x.usuario_id !== uid).concat(ids.map(m => ({usuario_id:uid, marca_id:m}))); },
  };
}

async function sembrarDemo(){

  for (const [i, [w, h, alt, link]] of [[1200, 240, 'Marca Demo', 'https://www.marca-demo.com/'], [1200, 900, 'Cyber Monday: hasta 50% off', 'https://www.marca-demo.com/cyber'], [1200, 700, 'Productos destacados', 'https://www.marca-demo.com/cyber/destacados']].entries()){

function piezaDemo(w, h, i){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  const fondos = ['#0b1929', '#f04e23', '#f2f4f7']; x.fillStyle = fondos[i]; x.fillRect(0, 0, w, h);
  x.fillStyle = i === 1 ? '#0b1929' : '#f04e23'; x.font = `800 ${i === 0 ? 64 : 110}px Montserrat, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(['MARCA DEMO', 'CYBER MONDAY', 'DESTACADOS'][i], w / 2, h / 2);
  return new Promise(r => c.toBlob(r, 'image/png'));
}

let cur = null, prep = null, errPrep = null, timerGuardar = null, vistaAncho = 640;
const CACHE_BYTES = new Map();   // url → bytes de la imagen (para medirla y calcular la huella)

async function bytesDe(url){
  if (CACHE_BYTES.has(url)) return CACHE_BYTES.get(url);
  const b = new Uint8Array(await (await fetch(url)).arrayBuffer()); CACHE_BYTES.set(url, b); return b;
}

async function abrirNews(id){
  $('vista').innerHTML = '<div class="vacio">Cargando…</div>';
  try { cur = await api.newsUna(id); } catch (e) { cur = null; toast(e.message, true); }
  if (!cur) { $('vista').innerHTML = '<div class="vacio">No existe esa news o no tenés acceso.</div>'; return; }
  try { await Promise.all((cur.piezas || []).map(p => bytesDe(p.url))); } catch { toast('No se pudieron leer algunas imágenes', true); }
  pintarEditor();
  recalcular();
  cargarEventos();
}

const editable = () => puedeEditar(cur.marca_id) && !['cargada', 'cancelada'].includes(cur.estado);

/** Input estándar a partir de la fila (la librería espera esta forma). */
function inputDe(n){
  const i = n.input || {};
  const base = {cliente:String(n.marca_id), nombre:n.nombre, asunto:i.asunto || '', preheader:i.preheader || '', remitente:i.remitente, responderA:i.responderA || undefined,
    segmento:i.segmento || '', envio:{fecha:n.fecha_envio || '', hora:n.hora_envio || ''}, emailsTest:i.emailsTest || [], links:i.links || [], utm:i.utm, textoPie:i.textoPie || undefined};
  if (n.contenido === 'html') base.html = 'pieza.html';
  else base.piezas = (n.piezas || []).map(p => ({imagen:p.archivo, alt:p.alt || '', link:p.link || undefined}));
  return base;
}

let timerCalc = null;
// Mientras se escribe: recalcula a los 250 ms para no redibujar la vista previa en cada tecla.
function recalcularPronto(){ clearTimeout(timerCalc); timerCalc = setTimeout(recalcular, 250); }

function recalcular(){
  clearTimeout(timerCalc);
  const cliente = clienteDe(cur.marca_id);
  prep = null; errPrep = null;
  if (!cliente) errPrep = [{severidad:'error', codigo:'cliente', mensaje:`${nombreMarca(cur.marca_id)} no está configurado: falta la herramienta, remitentes y segmentos (Clientes).`}];
  else {
    const input = inputDe(cur);
    // En la demo las imágenes son blob: del navegador; se valida como si estuvieran en un hosting público.
    const urlValidada = p => api.demo ? `https://demo.we-are.local/${p.archivo}` : p.url;
    const contenido = cur.contenido === 'html' ? {html: cur.html || ''} : {piezas: (cur.piezas || []).map(p => ({archivo:p.archivo, url:urlValidada(p), datos: CACHE_BYTES.get(p.url) || new Uint8Array()}))};
    if (cur.contenido === 'html' && !cur.html) errPrep = [{severidad:'error', codigo:'html', mensaje:'Cargá el HTML de Atlas.'}];
    else if (cur.contenido === 'piezas' && !(cur.piezas || []).length) errPrep = [{severidad:'error', codigo:'piezas', mensaje:'Subí las piezas (JPG o PNG) en orden.'}];
    else {
      try { prep = prepararCampana(input, {[String(cur.marca_id)]: cliente}, contenido, hoyArgentina()); }
      catch (e) { if (e instanceof ErrorPreparacion) errPrep = e.hallazgos; else errPrep = [{severidad:'error', codigo:'interno', mensaje:e.message}]; }
    }
  }
  pintarLado();
  // Medidas de las piezas (se conocen después de preparar).
  (prep?.piezas || []).forEach((p, k) => { const el = $("pzMed" + k); if (el) el.textContent = p.medidas ? p.medidas.ancho + "×" + p.medidas.alto + "px" : "no se pudo leer"; });
}

}

    </div>`;
  pintarPiezas(); pintarPlaceholders(); contadores();
  if (!editable()) return;

  const cambio = (fn) => () => { fn(); contadores(); recalcularPronto(); programarGuardado(); };
  const setI = (k, v) => { cur.input = {...(cur.input || {}), [k]: v}; };
  $('fNombre').oninput = cambio(() => cur.nombre = $('fNombre').value);

  if (!i.segmento && segs[0]) setI('segmento', segs[0][0]);
  document.querySelectorAll('[data-cont]').forEach(b => b.onclick = () => { cur.contenido = b.dataset.cont; pintarEditor(); recalcular(); programarGuardado(); });
  if ($('fHtmlFile')) $('fHtmlFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; cur.html = await f.text(); $('fHtml').value = cur.html; pintarPlaceholders(); recalcular(); programarGuardado(); };
  if ($('fFiles')) {
    $('fFiles').onchange = e => subirPiezas([...e.target.files]);

    d.ondragover = e => { e.preventDefault(); d.classList.add('on'); };

    d.ondrop = e => { e.preventDefault(); d.classList.remove('on'); subirPiezas([...e.dataTransfer.files].filter(f => /image\/(png|jpe?g|gif)/.test(f.type))); };

function contadores(){

async function subirPiezas(files){
  if (!files.length) return;
  files.sort((a, b) => a.name.localeCompare(b.name, 'es', {numeric:true}));
  toast(`Subiendo ${files.length} imagen(es)…`);
  try {
    for (const f of files) {
      const limpio = f.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.-]+/g, '-');
      const url = await api.subir(`${cur.marca_id}/${cur.id}/${Date.now()}-${limpio}`, f);
      CACHE_BYTES.set(url, new Uint8Array(await f.arrayBuffer()));
      cur.piezas = [...(cur.piezas || []), {url, archivo: limpio, alt:'', link:'', bytes:f.size}];
    }
    pintarPiezas(); recalcular(); guardar();
  } catch (e) { toast('No se pudo subir: ' + e.message, true); }
}

function pintarPiezas(){
  const el = $('listaPiezas'); if (!el) return;
  const ps = cur.piezas || [], dis = editable() ? '' : 'disabled';
  el.innerHTML = ps.map((p, k) => {
    const m = prep?.piezas?.[k]?.medidas;
    return `<div class="pz"><img src="${esc(p.url)}" alt="">
      <div><div class="meta"><strong>${k + 1}.</strong> ${esc(p.archivo)} · <span id="pzMed${k}">${m ? m.ancho + '×' + m.alto + 'px' : '…'}</span> · ${Math.round((p.bytes || 0) / 1024)} KB</div>
        <input class="inp" data-alt="${k}" placeholder="Texto alternativo (alt)" value="${esc(p.alt)}" ${dis}>
        <input class="inp" data-link="${k}" placeholder="Link de destino (https://…), vacío = sin link" value="${esc(p.link)}" ${dis}></div>
      ${editable() ? `<div class="pz-acc"><button data-sub="${k}" title="Subir" ${k ? '' : 'disabled'}>↑</button><button data-baj="${k}" title="Bajar" ${k < ps.length - 1 ? '' : 'disabled'}>↓</button><button data-del="${k}" title="Quitar">✕</button></div>` : '<span></span>'}
    </div>`;
  }).join('') || '<p class="nota">Todavía no hay piezas.</p>';
  if (!editable()) return;
  const set = () => { recalcularPronto(); programarGuardado(); };
  el.querySelectorAll('[data-alt]').forEach(x => x.oninput = () => { cur.piezas[+x.dataset.alt].alt = x.value; set(); });
  el.querySelectorAll('[data-link]').forEach(x => x.oninput = () => { cur.piezas[+x.dataset.link].link = x.value.trim(); set(); });
  const mover = (k, d) => { const a = cur.piezas; [a[k], a[k + d]] = [a[k + d], a[k]]; pintarPiezas(); set(); };
  el.querySelectorAll('[data-sub]').forEach(x => x.onclick = () => mover(+x.dataset.sub, -1));
  el.querySelectorAll('[data-baj]').forEach(x => x.onclick = () => mover(+x.dataset.baj, 1));
  el.querySelectorAll('[data-del]').forEach(x => x.onclick = () => { cur.piezas.splice(+x.dataset.del, 1); pintarPiezas(); set(); });
}

/** En la demo cambia las URLs de ejemplo por las imágenes reales (data:) para verlas en la vista previa. */
function htmlParaPrevia(){
  if (!api.demo) return prep.htmlFinal;
  let h = prep.htmlFinal;
  for (const p of cur.piezas || []) { const b = CACHE_BYTES.get(p.url); if (b) h = h.split(`https://demo.we-are.local/${p.archivo}`).join('data:image/png;base64,' + btoa(Array.from(b, c => String.fromCharCode(c)).join(''))); }
  return h;
}

/** Lo que se persiste: la fila con el resultado de la preparación. */
function filaParaGuardar(){
  const hs = prep ? prep.hallazgos : (errPrep || []);
  return {
    nombre: cur.nombre, fecha_envio: cur.fecha_envio || null, hora_envio: cur.hora_envio || null, input: cur.input || {},
    contenido: cur.contenido, html: cur.contenido === 'html' ? (cur.html || '') : null,
    piezas: (cur.piezas || []).map((p, k) => ({...p, ancho: prep?.piezas?.[k]?.medidas?.ancho, alto: prep?.piezas?.[k]?.medidas?.alto, sha: prep?.piezas?.[k]?.sha})),
    html_final: prep?.htmlFinal || null, huella: prep?.huella || null,
    n_errores: hs.filter(h => h.severidad === 'error').length, n_avisos: hs.filter(h => h.severidad === 'aviso').length,
  };
}

function programarGuardado(){ clearTimeout(timerGuardar); if ($('guardado')) $('guardado').textContent = 'Sin guardar…'; timerGuardar = setTimeout(guardar, 1200); }
async function guardar(extra = {}){
  clearTimeout(timerGuardar); timerGuardar = null;
  const fila = {...filaParaGuardar(), ...extra};
  // Editar con errores una news "lista" la devuelve a borrador (la base no la deja quedar lista con errores).
  if (cur.estado === 'lista' && fila.n_errores && !extra.estado) fila.estado = 'borrador';
  try {
    const antes = cur.estado;
    const n = await api.guardarNews(cur.id, fila);
    Object.assign(cur, {estado:n.estado, aprobado_por:n.aprobado_por, aprobado_at:n.aprobado_at, aprobado_huella:n.aprobado_huella, cargado_por:n.cargado_por, cargado_at:n.cargado_at, id_externo:n.id_externo});
    const i = D.news.findIndex(x => x.id === cur.id); if (i >= 0) D.news[i] = {...D.news[i], ...n};
    if (antes !== n.estado || extra.estado) { pintarLado(); if (['aprobada','cargada'].includes(antes) && n.estado !== antes && !extra.estado) toast('Cambió el contenido: la aprobación se cayó y hay que aprobar de nuevo', true); }
    if ($('guardado')) $('guardado').textContent = 'Guardado ' + new Date().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
    cargarEventos();
    return true;
  } catch (e) { toast('No se guardó: ' + (e.message || e), true); if ($('guardado')) $('guardado').textContent = 'Error al guardar'; return false; }
}

async function cambiarEstado(estado, extra = {}){
  if (await guardar({estado, ...extra})) {
    toast(EST[estado]);
    if (!editable()) { pintarEditor(); recalcular(); }
  }
}

  const marcas = D.marcas.filter(m => m.activa !== false);
  $('vista').innerHTML = `<div class="head"><h1>Accesos</h1><span class="muted">La persona entra con su cuenta de Supabase; acá se habilita su mail, el rol y las marcas.</span><div class="sp"></div><button class="btn-pri" id="addUser">+ Usuario</button></div>
    <div class="tabla"><table><thead><tr><th>Usuario</th><th>Rol</th><th>Marcas</th><th>Último ingreso</th><th></th></tr></thead><tbody>${D.usuarios.map(u => `
      <tr data-u="${u.id}"><td><strong>${esc(u.nombre || '')}</strong><br><span class="muted">${esc(u.email)}</span>${u.activo ? '' : ' <span class="est cancelada">inactivo</span>'}</td><td>${ROL[u.rol]}</td>
      <td class="muted">${u.rol === 'admin' ? 'Todas' : D.um.filter(x => x.usuario_id === u.id).map(x => esc(nombreMarca(x.marca_id))).join(', ') || '—'}</td><td class="muted">${fechaHora(u.ultimo_ingreso)}</td><td><button class="bt sm">Editar</button></td></tr>`).join('')}</tbody></table></div>`;
  $('addUser').onclick = () => modalUsuario({email:'', nombre:'', rol:'editor', activo:true}, marcas);
  document.querySelectorAll('tr[data-u]').forEach(tr => tr.onclick = () => modalUsuario({...D.usuarios.find(u => u.id === +tr.dataset.u)}, marcas));
}

function modalUsuario(u, marcas){
  const mias = new Set(D.um.filter(x => x.usuario_id === u.id).map(x => x.marca_id));
  abrirModal(`<h3>${u.id ? 'Editar usuario' : 'Nuevo usuario'}</h3>
    <label class="lb" for="uEmail">Email</label><input class="inp" id="uEmail" value="${esc(u.email)}" ${u.id ? 'disabled' : ''}>
    <label class="lb" for="uNombre">Nombre</label><input class="inp" id="uNombre" value="${esc(u.nombre || '')}">
    <div class="row2"><div><label class="lb" for="uRol">Rol</label><select class="inp" id="uRol">${Object.entries(ROL).map(([k, v]) => `<option value="${k}" ${u.rol === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    <div><label class="lb" for="uActivo">Estado</label><select class="inp" id="uActivo"><option value="1" ${u.activo ? 'selected' : ''}>Activo</option><option value="0" ${u.activo ? '' : 'selected'}>Inactivo</option></select></div></div>
    <label class="lb">Marcas (no aplica a admin)</label><div style="max-height:180px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px">${marcas.map(m => `<label style="display:flex;gap:6px;font-size:13px"><input type="checkbox" data-m="${m.id}" ${mias.has(m.id) ? 'checked' : ''}> ${esc(m.nombre)}</label>`).join('')}</div>
    <div class="ft"><button class="bt" data-cerrar>Cancelar</button><button class="btn-pri" id="uGuardar">Guardar</button></div>`,
    () => $('uGuardar').onclick = async () => {
      const fila = {...(u.id ? {id:u.id} : {email: $('uEmail').value.trim().toLowerCase()}), nombre: $('uNombre').value.trim(), rol: $('uRol').value, activo: $('uActivo').value === '1'};
      if (!u.id && !fila.email) return toast('Falta el email', true);
      try {
        const g = await api.guardarUsuario(fila);
        await api.marcasDeUsuario(g.id, [...document.querySelectorAll('[data-m]')].filter(x => x.checked).map(x => +x.dataset.m));
        cerrarModal(); await cargar(); vistaAccesos(); toast('Usuario guardado');
      } catch (e) { toast(e.message, true); }
    });
}

// ══ MODAL ═══════════════════════════════════════════════════════════════════
function abrirModal(html, alAbrir){
  $('modal').innerHTML = html; $('ov').classList.add('on');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => b.onclick = cerrarModal);
  if (alAbrir) alAbrir();
}
function cerrarModal(){ $('ov').classList.remove('on'); }
$('ov').onclick = e => { if (e.target === $('ov')) cerrarModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
window.addEventListener('beforeunload', e => { if (timerGuardar && cur) { guardar(); e.preventDefault(); } });

// ══ ARRANQUE ════════════════════════════════════════════════════════════════
api.sesion().then(s => { if (s) boot(); });
console.log('Implementación de news', VERSION_APP);
</script>
</body>
</html>
