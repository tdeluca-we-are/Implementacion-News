<style>

    --acc:#f04e23; --acc2:#d43d16;
    --ink:#0b1929; --mut:#6b7385; --line:#e3e5e9; --soft:#f4f5f7; --canvas:#eceef2; --surface:#fff;
    --chip-bg:#eef0f3; --chip-ink:#58606e;

    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --ink:#f0f0f0; --mut:#8892a4; --line:rgba(255,255,255,.12); --soft:#1a3355; --canvas:#0b1929; --surface:#112240;
    --chip-bg:#1a3355; --chip-ink:#c5ccd8;
    --err:#f87171; --err-bg:rgba(239,68,68,.14); --av:#fbbf24; --av-bg:rgba(245,158,11,.16); --ok:#4ade80; --ok-bg:rgba(34,197,94,.16); --info:#8fb4ff; --info-bg:rgba(80,130,255,.16);

  [hidden]{display:none !important}
  .sp{flex:1}.muted{color:var(--mut)}
  a{color:var(--acc)}
  code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}

  /* login */

  .auth-card{width:380px;max-width:100%;background:var(--navy2);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:34px 30px;color:#f0f0f0;text-align:center}
  .auth-logo{font-size:26px;font-weight:800;letter-spacing:-.02em}.auth-logo .are{color:var(--acc)}
  .auth-sub{font-size:12px;color:#8892a4;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:4px 0 24px}
  .auth-card label{display:block;text-align:left;font-size:12px;color:#8892a4;font-weight:600;margin:0 0 6px}
  .auth-card input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:var(--navy);color:#f0f0f0;margin-bottom:14px}
  .auth-card input:focus{outline:none;border-color:var(--acc)}
  .auth-btn{width:100%;padding:12px;border:0;border-radius:9px;background:var(--acc);color:#fff;font-weight:700}
  .auth-err{color:#ff8a70;font-size:13px;min-height:18px;margin-top:12px}
  .auth-demo{display:inline-block;margin-top:14px;font-size:12px;color:#8892a4}

  /* barra superior */
  .nav{display:flex;align-items:center;gap:10px;padding:0 20px;height:52px;background:var(--navy);color:#f0f0f0;position:sticky;top:0;z-index:20}
  .logo{font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}.logo .are{color:var(--acc)}
  .nav-div{width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 4px}
  .nav-sub{font-size:12px;color:#8892a4;font-weight:600;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;margin-right:14px}
  .nav a{color:#c5ccd8;text-decoration:none;font-weight:600;font-size:13.5px;padding:16px 10px;border-bottom:3px solid transparent;white-space:nowrap}
  .nav a:hover{color:#fff}.nav a.on{color:#fff;border-bottom-color:var(--acc)}
  .user{font-size:13px;font-weight:600;color:#c5ccd8;white-space:nowrap}
  .role{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:10px;background:#33415a;color:#dfe5ee}

  h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 12px}

  .tabla{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
  table{width:100%;border-collapse:collapse;min-width:720px}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
  tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}

  .lado{position:sticky;top:68px}

  .tabs{display:flex;gap:6px;margin-bottom:12px}

  .drop.on{border-color:var(--acc);color:var(--acc)}
  .pz{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
  .pz img{width:84px;border-radius:6px;border:1px solid var(--line);display:block}

  .pz-acc{display:flex;flex-direction:column;gap:4px}

  /* Armado: el mail en miniatura */

  .fila-arm{display:flex}
  .tile{position:relative;flex:1 1 0;min-width:0;cursor:pointer;outline:3px solid transparent;outline-offset:-3px;background:#fff}
  .tile[draggable="true"]{cursor:grab}
  .tile img{display:block;width:100%;height:auto;pointer-events:none}
  .tile.sel{outline-color:var(--acc);z-index:1}
  .tile.moviendo{opacity:.35}
  .tile.izq::before,.tile.der::after{content:"";position:absolute;top:0;bottom:0;width:6px;background:var(--acc);z-index:2}
  .tile.izq::before{left:0}.tile.der::after{right:0}
  .tile-n{position:absolute;top:4px;left:4px;background:rgba(11,25,41,.85);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
  .tile-sin{position:absolute;bottom:4px;left:4px;background:var(--err);color:#fff;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px}
  .drop-fila{height:6px;border-radius:3px;margin:2px 0;transition:height .1s}
  .drop-fila.on{height:14px;background:var(--acc)}
  .detalle-pz{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px}
  .detalle-pz .meta{font-size:12px;color:var(--mut)}
  .pz-acc button{width:30px;height:28px;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:6px}

  .estado-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .nota{font-size:12px;color:var(--mut);margin-top:8px}
  .hz{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
  .h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:13px;padding:7px 10px;border-radius:8px}
  .h b{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:1px}
  .h.error{background:var(--err-bg)}.h.error b{color:var(--err)}
  .h.aviso{background:var(--av-bg)}.h.aviso b{color:var(--av)}
  .h.info{background:var(--soft)}.h.info b{color:var(--mut)}
  .h code{display:block;margin-top:3px;color:var(--mut);word-break:break-all}
  .resumen{display:flex;gap:14px;font-size:13px;font-weight:600;margin-bottom:10px}
  .previa-marco{background:#e9edf2;border-radius:10px;padding:12px;display:flex;justify-content:center;overflow:auto}
  .previa-marco iframe{border:0;background:#fff;width:640px;max-width:100%;height:720px;border-radius:4px}
  .campo{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .campo:last-child{border-bottom:0}
  .campo .et{color:var(--mut);font-size:12px}.campo .val{word-break:break-word;font-weight:600}
  .reg{font-size:12.5px;display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto}
  .reg div{display:flex;gap:8px}.reg time{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}

  /* config de clientes / accesos */
  .lista-cfg{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
  @media (max-width:900px){.lista-cfg{grid-template-columns:1fr}}
  .marcas{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow:auto}
  .marca-it{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid transparent;background:transparent;padding:8px 10px;border-radius:8px;font-weight:600}
  .marca-it:hover{background:var(--soft)}.marca-it.on{border-color:var(--acc);background:var(--soft)}
  .filas{display:flex;flex-direction:column;gap:6px}
  .fila{display:grid;gap:6px;align-items:center}
  .fila button{padding:6px 9px}

  .ov{position:fixed;inset:0;background:rgba(5,12,22,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
  .ov.on{display:flex}
  .modal{width:460px;max-width:100%;background:var(--surface);border-radius:14px;padding:22px;border:1px solid var(--line)}
  .modal h3{margin:0 0 6px;font-size:17px}
  .modal .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;transition:transform .25s;z-index:80;max-width:90vw}
  .toast.on{transform:translateX(-50%) translateY(0)}.toast.err{background:var(--err)}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<script type="module">
import { prepararCampana, ErrorPreparacion } from './lib/hub/nucleo.js';
import { hoyArgentina } from './lib/input/validar.js';
import { PERFILES } from './lib/tools/perfiles.js';

const VERSION_APP = '2026-10-20.2';
const SB_URL  = 'https://ojzcxwhoinmljospgmfp.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qemN4d2hvaW5tbGpvc3BnbWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDY5MTYsImV4cCI6MjA5MzQ4MjkxNn0.jmvVP3weuclrBpQJb57BwmHD77Ofy4CDe43cnmiSFCk';
const BUCKET = 'nws-piezas';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROL = {admin:'Admin', editor:'Editor', lector:'Lector'};
const EST = {borrador:'Borrador', lista:'Lista para aprobar', aprobada:'Aprobada', cargada:'Cargada', cancelada:'Cancelada'};
const HERR = {woowup:'WoowUp', icomm:'icomm', marketingnube:'Marketing Nube', connectif:'Connectif'};
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function toast(msg, err){ const t = $('toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 2800); }
function fechaHora(iso){ if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'}); }
const fechaCorta = f => f ? f.split('-').reverse().slice(0, 2).join('/') : '—';
const largo = s => [...new Intl.Segmenter('es').segment(s || '')].length;
async function copiar(btn, texto){
  try { await navigator.clipboard.writeText(texto); const t = btn.textContent; btn.textContent = 'Copiado'; btn.classList.add('copiado'); setTimeout(() => { btn.textContent = t; btn.classList.remove('copiado'); }, 1300); }
  catch { toast('No se pudo copiar: seleccioná el texto a mano', true); }

// ══ DATOS ═══════════════════════════════════════════════════════════════════
// Dos implementaciones con la misma forma: Supabase y una demo en memoria para
// mostrar el hub sin cuenta (no guarda nada).
function apiSupabase(){
  const sb = supabase.createClient(SB_URL, SB_ANON);
  const q = async p => { const r = await p; if (r.error) throw r.error; return r.data; };
  async function todo(tabla, cols = '*', orden){ let out = [], pag = 0; for(;;){ let x = sb.from(tabla).select(cols); if (orden) x = x.order(orden.col, {ascending: orden.asc}); const d = await q(x.range(pag * 1000, pag * 1000 + 999)); out = out.concat(d); if (d.length < 1000) return out; pag++; } }
  return {
    demo: false,
    async sesion(){ return (await sb.auth.getSession()).data.session; },
    async entrar(email, password){ const r = await sb.auth.signInWithPassword({email, password}); if (r.error) throw r.error; },
    salir: () => sb.auth.signOut(),
    async vincular(){ const r = await sb.rpc('nws_vincular'); if (r.error) throw r.error; return (r.data || [])[0] || null; },
    marcas: () => todo('sem_marcas', 'id,nombre,activa', {col:'nombre', asc:true}),
    usuarioMarcas: () => todo('nws_usuario_marcas'),
    usuarios: () => todo('nws_usuarios', '*', {col:'nombre', asc:true}),
    configs: () => todo('nws_cliente_config'),
    news: () => todo('nws_news', 'id,marca_id,nombre,fecha_envio,hora_envio,estado,n_errores,n_avisos,actualizado_por,actualizado_at', {col:'actualizado_at', asc:false}),
    async newsUna(id){ return (await q(sb.from('nws_news').select('*').eq('id', id)))[0] || null; },
    async crearNews(fila){ return (await q(sb.from('nws_news').insert(fila).select()))[0]; },
    async guardarNews(id, cambios){ return (await q(sb.from('nws_news').update(cambios).eq('id', id).select()))[0]; },
    eventos: id => q(sb.from('nws_eventos').select('*').eq('news_id', id).order('en', {ascending:false}).limit(50)),
    async guardarConfig(fila){ return (await q(sb.from('nws_cliente_config').upsert(fila).select()))[0]; },
    async subir(path, file){ await q(sb.storage.from(BUCKET).upload(path, file, {upsert:false, contentType:file.type})); return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; },
    async guardarUsuario(u){ return (await q(u.id ? sb.from('nws_usuarios').update(u).eq('id', u.id).select() : sb.from('nws_usuarios').insert(u).select()))[0]; },
    async marcasDeUsuario(uid, ids){ await q(sb.from('nws_usuario_marcas').delete().eq('usuario_id', uid)); if (ids.length) await q(sb.from('nws_usuario_marcas').insert(ids.map(m => ({usuario_id:uid, marca_id:m})))); },
    // Carga automática: la hace la función de servidor nws-woowup con la credencial del cliente.
    async implementar(news_id, accion){
      const r = await sb.functions.invoke('nws-woowup', {body:{accion, news_id}});
      if (r.error) {
        let m = r.error.message || 'Error en la carga automática';
        try { m = (await r.error.context.json()).error || m; } catch {}
        if (/Failed to send a request/i.test(m)) m = 'La función nws-woowup no está publicada en Supabase (Edge Functions).';
        throw new Error(m);
      }
      return r.data;
    },

function apiDemo(){
  const ahora = () => new Date().toISOString();
  const db = {
    marcas: [{id:1, nombre:'Marca demo', activa:true}, {id:2, nombre:'Otra marca demo', activa:true}],
    configs: [
      {marca_id:1, herramienta:'woowup', cuenta:'marca-demo', remitentes:[{nombre:'Marca Demo', email:'newsletter@marca-demo.com'}], dominios_remitente:['marca-demo.com'], segmentos:{todos:{id:'0', nombre:'Todos los usuarios'}, compradores:{id:'100001', nombre:'Compradores 2026'}}, utm:{source:'woowup', medium:'email'}, dominios_sitio:['marca-demo.com'], automatizar:false, extra:{woowup:{servicio:12}}},
    ],
    usuarios: [{id:1, email:'demo@we-are.com.ar', nombre:'Usuario demo', rol:'admin', activo:true}],
    um: [], news: [], eventos: [], id: 1, cred: {1: new Date().toISOString()},
  };
  const evento = (n, accion, detalle) => db.eventos.unshift({id:Date.now(), news_id:n.id, marca_id:n.marca_id, en:ahora(), usuario:'Usuario demo', accion, detalle});
  return {
    demo: true,
    async sesion(){ return {demo:true}; }, async entrar(){}, async salir(){},
    async vincular(){ return db.usuarios[0]; },
    async marcas(){ return db.marcas; }, async usuarioMarcas(){ return db.um; }, async usuarios(){ return db.usuarios; },
    async configs(){ return db.configs; }, async news(){ return db.news.map(n => ({...n})); },
    async newsUna(id){ const n = db.news.find(x => x.id === id); return n ? structuredClone(n) : null; },
    async crearNews(f){ const n = {id:db.id++, estado:'borrador', input:{}, piezas:[], contenido:'piezas', n_errores:0, n_avisos:0, creado_at:ahora(), actualizado_at:ahora(), actualizado_por:'Usuario demo', ...f}; db.news.unshift(n); evento(n, 'creada'); return structuredClone(n); },
    async guardarNews(id, c){
      // Mismas reglas que el trigger de la base.
      const n = db.news.find(x => x.id === id); const antes = n.estado, huellaAntes = n.huella;
      Object.assign(n, c, {actualizado_at:ahora(), actualizado_por:'Usuario demo'});
      if (['aprobada','cargada'].includes(antes) && n.huella !== huellaAntes){ n.estado = n.n_errores ? 'borrador' : 'lista'; n.aprobado_por = n.aprobado_at = n.aprobado_huella = null; evento(n, n.estado, 'cambió el contenido: se cayó la aprobación'); return structuredClone(n); }
      if (['lista','aprobada'].includes(n.estado) && n.n_errores) { Object.assign(n, {estado:antes}); throw new Error('La news tiene errores de validación'); }
      if (n.estado === 'aprobada' && antes !== 'aprobada'){ if (n.aprobado_huella !== n.huella) throw new Error('La huella aprobada no es la actual'); n.aprobado_por = 'Usuario demo'; n.aprobado_at = ahora(); }
      if (n.estado === 'cargada' && antes !== 'cargada'){ if (antes !== 'aprobada') throw new Error('Solo se puede marcar como cargada una news aprobada'); n.cargado_por = 'Usuario demo'; n.cargado_at = ahora(); }
      if (n.estado !== antes) evento(n, n.estado); else if (n.huella !== huellaAntes) evento(n, 'editada');
      return structuredClone(n);
    },
    async eventos(id){ return db.eventos.filter(e => e.news_id === id); },
    async guardarConfig(f){ const i = db.configs.findIndex(c => c.marca_id === f.marca_id); if (i >= 0) db.configs[i] = f; else db.configs.push(f); return f; },
    async subir(_path, file){ return URL.createObjectURL(file); },
    async guardarUsuario(u){ if (!u.id){ u.id = db.usuarios.length + 1; db.usuarios.push(u); } else Object.assign(db.usuarios.find(x => x.id === u.id), u); return u; },
    async marcasDeUsuario(uid, ids){ db.um = db.um.filter(x => x.usuario_id !== uid).concat(ids.map(m => ({usuario_id:uid, marca_id:m}))); },
    async implementar(news_id, accion){
      // Simula la función de servidor: mismas reglas, sin tocar WoowUp.
      await new Promise(r => setTimeout(r, 700));
      const n = db.news.find(x => x.id === news_id);
      if (accion === 'programar') throw new Error(`Programar desde el hub todavía no está disponible. Programala en WoowUp (#${n.id_externo}) para el ${n.fecha_envio} a las ${n.hora_envio} y marcala como cargada.`);
      if (n.n_errores) throw new Error('La news tiene errores de validación: corregilos antes de implementar.');
      const nueva = !n.id_externo; n.id_externo = n.id_externo || String(700000 + n.id);
      n.implementado_huella = n.huella; n.implementado_at = ahora(); if (n.estado === 'borrador') n.estado = 'lista';
      evento(n, 'implementada', `${nueva ? 'Borrador creado' : 'Borrador actualizado'} en WoowUp (#${n.id_externo}) · test a ${(n.input.emailsTest || []).length} destinatario(s) (demo: no se envió nada)`);
      return {ok:true, idExterno:n.id_externo, url:'#', mensaje:`Demo: campaña #${n.id_externo} simulada; en la real llega el test a ${(n.input.emailsTest || []).join(', ')}.`};
    },
    async credencialCargada(m){ return db.cred[m] || null; },
    async evento(n, accion, detalle){ evento(n, accion, detalle); },
    async guardarCredencial(m, _h, d){ db.cred[m] = d && Object.keys(d).length ? ahora() : null; return db.cred[m]; },
  };
}

let cur = null, prep = null, errPrep = null, timerGuardar = null, vistaAncho = 640;
const CACHE_BYTES = new Map();   // url → bytes de la imagen (para medirla y calcular la huella)

async function bytesDe(url){
  if (CACHE_BYTES.has(url)) return CACHE_BYTES.get(url);
  const b = new Uint8Array(await (await fetch(url)).arrayBuffer()); CACHE_BYTES.set(url, b); return b;
}

const editable = () => puedeEditar(cur.marca_id) && !['cargada', 'cancelada'].includes(cur.estado);

/** Input estándar a partir de la fila (la librería espera esta forma). */
function inputDe(n){
  const i = n.input || {};
  const base = {cliente:String(n.marca_id), nombre:n.nombre, asunto:i.asunto || '', preheader:i.preheader || '',
    segmento:(i.segmento || '').trim(), links:i.links || [], textoPie:i.textoPie || undefined};
  if (n.fecha_envio || n.hora_envio) base.envio = {fecha:n.fecha_envio || '', hora:n.hora_envio || ''};
  if (n.contenido === 'html') base.html = 'pieza.html';
  // Sin alt propio, cada foto usa el asunto (lo que se lee si el mail bloquea imágenes).
  else base.piezas = (n.piezas || []).map((p, k) => ({imagen:p.archivo, alt:p.alt || i.asunto || n.nombre || '', link:p.link || undefined, junto: k > 0 && !!p.junto}));
  return base;
}

let timerCalc = null;
// Mientras se escribe: recalcula a los 250 ms para no redibujar la vista previa en cada tecla.
function recalcularPronto(){ clearTimeout(timerCalc); timerCalc = setTimeout(recalcular, 250); }

function recalcular(){
  clearTimeout(timerCalc);
  const cliente = clienteDe(cur.marca_id);
  prep = null; errPrep = null;
  if (!cliente) errPrep = [{severidad:'error', codigo:'cliente', mensaje:`${nombreMarca(cur.marca_id)} no está configurado: en Clientes elegí la herramienta y la cuenta.`}];
  else {
    const input = inputDe(cur);
    // En la demo las imágenes son blob: del navegador; se valida como si estuvieran en un hosting público.
    const urlValidada = p => api.demo ? `https://demo.we-are.local/${p.archivo}` : p.url;
    const contenido = cur.contenido === 'html' ? {html: cur.html || ''} : {piezas: (cur.piezas || []).map(p => ({archivo:p.archivo, url:urlValidada(p), datos: CACHE_BYTES.get(p.url) || new Uint8Array()}))};
    if (cur.contenido === 'html' && !cur.html) errPrep = [{severidad:'error', codigo:'html', mensaje:'Cargá el HTML de Atlas.'}];
    else if (cur.contenido === 'piezas' && !(cur.piezas || []).length) errPrep = [{severidad:'error', codigo:'piezas', mensaje:'Subí las piezas (JPG o PNG) en orden.'}];
    else {
      try { prep = prepararCampana(input, {[String(cur.marca_id)]: cliente}, contenido, hoyArgentina()); }
      catch (e) { if (e instanceof ErrorPreparacion) errPrep = e.hallazgos; else errPrep = [{severidad:'error', codigo:'interno', mensaje:e.message}]; }
    }
  }
  pintarLado();
  // Medidas de las piezas (se conocen después de preparar).
  (prep?.piezas || []).forEach((p, k) => { const el = $("pzMed" + k); if (el) el.textContent = p.medidas ? p.medidas.ancho + "×" + p.medidas.alto + "px" : "no se pudo leer"; });
}

          <div class="tabs"><button class="tab ${n.contenido === 'piezas' ? 'on' : ''}" data-cont="piezas" ${dis}>Imágenes (JPG/PNG)</button><button class="tab ${n.contenido === 'html' ? 'on' : ''}" data-cont="html" ${dis}>HTML de Atlas</button></div>
          <div id="contPiezas" ${n.contenido === 'piezas' ? '' : 'hidden'}>
            ${editable() ? '<label class="drop" id="drop" for="fFiles">Arrastrá las piezas acá o hacé clic para elegirlas. Se ordenan por nombre; después podés moverlas y poner dos o más en la misma fila.<input type="file" id="fFiles" accept="image/png,image/jpeg,image/gif" multiple hidden></label><div style="margin-top:8px"><button class="bt sm" id="fDrive" type="button">Importar desde Drive</button> <span class="muted" style="font-size:12px">pegás el link de la carpeta o de la imagen</span></div>' : ''}
            <div id="listaPiezas"></div>
            <label class="lb" for="fPie">Texto al pie (recomendado: un mail de solo imágenes entrega peor)</label>
            <textarea class="inp" id="fPie" ${dis}>${esc(i.textoPie || '')}</textarea>
          </div>
          <div id="contHtml" ${n.contenido === 'html' ? '' : 'hidden'}>
            ${editable() ? '<input type="file" id="fHtmlFile" accept=".html,.htm,text/html"> <span class="muted">o pegalo abajo</span>' : ''}
            <textarea class="inp mono" id="fHtml" style="min-height:160px;margin-top:8px" ${dis} placeholder="<!DOCTYPE html>…">${esc(n.html || '')}</textarea>
            <div id="linksPh"></div>
          </div>
        </section>
      </div>
      <div class="col lado" id="lado"></div>
    </div>`;
  pintarPiezas(); pintarPlaceholders(); contadores();
  if (!editable()) return;

  const cambio = (fn) => () => { fn(); contadores(); recalcularPronto(); programarGuardado(); };
  const setI = (k, v) => { cur.input = {...(cur.input || {}), [k]: v}; };
  $('fNombre').oninput = cambio(() => cur.nombre = $('fNombre').value);
  $('fAsunto').oninput = cambio(() => setI('asunto', $('fAsunto').value));
  $('fPre').oninput = cambio(() => setI('preheader', $('fPre').value));
  $('fSeg').oninput = cambio(() => setI('segmento', $('fSeg').value));
  $('fSeg').onchange = () => recordarSegmento(cur.marca_id, $('fSeg').value);
  $('fFecha').onchange = cambio(() => cur.fecha_envio = $('fFecha').value);
  $('fHora').onchange = cambio(() => cur.hora_envio = $('fHora').value);
  $('fPie').oninput = cambio(() => setI('textoPie', $('fPie').value));
  $('fHtml').oninput = cambio(() => { cur.html = $('fHtml').value; pintarPlaceholders(); });
  document.querySelectorAll('[data-cont]').forEach(b => b.onclick = () => { cur.contenido = b.dataset.cont; pintarEditor(); recalcular(); programarGuardado(); });
  if ($('fHtmlFile')) $('fHtmlFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; cur.html = await f.text(); $('fHtml').value = cur.html; pintarPlaceholders(); recalcular(); programarGuardado(); };
  if ($('fDrive')) $('fDrive').onclick = modalDrive;
  if ($('fFiles')) {
    $('fFiles').onchange = e => subirPiezas([...e.target.files]);
    const d = $('drop');
    d.ondragover = e => { e.preventDefault(); d.classList.add('on'); };
    d.ondragleave = () => d.classList.remove('on');
    d.ondrop = e => { e.preventDefault(); d.classList.remove('on'); subirPiezas([...e.dataTransfer.files].filter(f => /image\/(png|jpe?g|gif)/.test(f.type))); };
  }
}

/** Segmentos ya usados con esta marca (en este navegador) para sugerirlos. */
function segmentosDeMarca(marcaId){
  const cfg = D.configs[marcaId];
  const delCliente = Object.values(cfg?.segmentos || {}).map(sg => sg.nombre || sg.id);
  return [...new Set([...(lsGet('nws_segs_' + marcaId) || []), ...delCliente, 'Todos los usuarios'])].filter(Boolean).slice(0, 30);
}
function recordarSegmento(marcaId, valor){
  const v = (valor || '').trim(); if (!v) return;
  lsSet('nws_segs_' + marcaId, [v, ...(lsGet('nws_segs_' + marcaId) || []).filter(x => x !== v)].slice(0, 20));
}

function contadores(){
  const c = (id, n, a, e) => { const el = $(id + 'Cnt'); if (!el) return; const l = largo($(id).value); el.textContent = l + ' caracteres'; el.className = 'cnt' + (l > e ? ' err' : l > a ? ' av' : ''); };
  c('fAsunto', 0, 60, 150); c('fPre', 0, 130, 150);
}

async function subirPiezas(files){
  if (!files.length) return;
  files.sort((a, b) => a.name.localeCompare(b.name, 'es', {numeric:true}));
  toast(`Subiendo ${files.length} imagen(es)…`);
  try {
    for (const f of files) {
      const limpio = f.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.-]+/g, '-');
      const url = await api.subir(`${cur.marca_id}/${cur.id}/${Date.now()}-${limpio}`, f);
      CACHE_BYTES.set(url, new Uint8Array(await f.arrayBuffer()));
      cur.piezas = [...(cur.piezas || []), {url, archivo: limpio, alt:'', link:'', bytes:f.size}];
    }
    pintarPiezas(); recalcular(); guardar();
  } catch (e) { toast('No se pudo subir: ' + e.message, true); }
}

// ── Armado de piezas: el mail en miniatura, se ordena arrastrando ──
// Las piezas se guardan en orden con "junto" (va en la fila de la anterior); acá se trabaja por filas.
let piezaSel = 0, arrastrando = null;

function filasDePiezas(){
  const filas = [];
  (cur.piezas || []).forEach((p, k) => { if (k > 0 && p.junto) filas[filas.length - 1].push(p); else filas.push([p]); });
  return filas;
}
function aplicarFilas(filas){
  cur.piezas = filas.filter(f => f.length).flatMap(f => f.map((p, i) => ({...p, junto: i > 0})));
}
function cambioArmado(){ pintarPiezas(); recalcular(); programarGuardado(); }

/** Mueve una pieza: a una fila nueva (antes de la fila que empieza con "ancla") o al costado de otra pieza. */
function moverPieza(pieza, destino){
  const filas = filasDePiezas().map(f => f.filter(p => p !== pieza));
  if (destino.tipo === 'fila') {
    const i = destino.ancla ? filas.findIndex(f => f.includes(destino.ancla)) : -1;
    filas.splice(i < 0 ? filas.length : i, 0, [pieza]);
  } else {
    const f = filas.find(f => f.includes(destino.pieza));
    if (!f) return;
    f.splice(f.indexOf(destino.pieza) + (destino.lado === 'der' ? 1 : 0), 0, pieza);
  }
  aplicarFilas(filas);
  piezaSel = cur.piezas.indexOf(pieza);
  cambioArmado();
}

function pintarPiezas(){
  const el = $('listaPiezas'); if (!el) return;
  const ps = cur.piezas || [];
  if (!ps.length) { el.innerHTML = '<p class="nota">Todavía no hay piezas.</p>'; return; }
  if (piezaSel >= ps.length) piezaSel = 0;
  const filas = filasDePiezas();
  const puede = editable();
  const barra = (ancla) => puede ? `<div class="drop-fila" data-ancla="${ancla ? ps.indexOf(ancla) : ''}"></div>` : '';
  el.innerHTML = `
    ${puede ? '<p class="nota" style="margin:12px 0 6px">Así queda el mail. Arrastrá una foto para cambiarla de lugar; soltala <b>sobre el costado de otra</b> para ponerlas en la misma fila. Tocá una foto para cargarle el link.</p>' : ''}
    <div class="armado">
      ${filas.map(f => `${barra(f[0])}<div class="fila-arm">${f.map(p => {
        const k = ps.indexOf(p);
        return `<div class="tile ${k === piezaSel ? 'sel' : ''}" data-k="${k}" ${puede ? 'draggable="true"' : ''} title="Pieza ${k + 1}">
          <img src="${esc(p.url)}" alt="" draggable="false"><span class="tile-n">${k + 1}</span>${p.link ? '' : '<span class="tile-sin">sin link</span>'}</div>`;
      }).join('')}</div>`).join('')}
      ${barra(null)}
    </div>
    <div id="pzDetalle"></div>`;
  pintarDetallePieza();

  el.querySelectorAll('.tile').forEach(t => {
    const k = +t.dataset.k;
    t.onclick = () => { piezaSel = k; el.querySelectorAll('.tile').forEach(x => x.classList.toggle('sel', x === t)); pintarDetallePieza(); };
    if (!puede) return;
    t.ondragstart = e => { arrastrando = ps[k]; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(k)); t.classList.add('moviendo'); };
    t.ondragend = () => { arrastrando = null; el.querySelectorAll('.moviendo,.izq,.der,.on').forEach(x => x.classList.remove('moviendo', 'izq', 'der', 'on')); };
    t.ondragover = e => {
      if (!arrastrando || arrastrando === ps[k]) return;
      e.preventDefault();
      const lado = e.offsetX < t.clientWidth / 2 ? 'izq' : 'der';
      t.classList.toggle('izq', lado === 'izq'); t.classList.toggle('der', lado === 'der');
    };
    t.ondragleave = () => t.classList.remove('izq', 'der');
    t.ondrop = e => {
      e.preventDefault();
      if (!arrastrando || arrastrando === ps[k]) return;
      moverPieza(arrastrando, {tipo:'costado', pieza: ps[k], lado: e.offsetX < t.clientWidth / 2 ? 'izq' : 'der'});
    };
  });
  el.querySelectorAll('.drop-fila').forEach(b => {
    b.ondragover = e => { if (!arrastrando) return; e.preventDefault(); b.classList.add('on'); };
    b.ondragleave = () => b.classList.remove('on');
    b.ondrop = e => { e.preventDefault(); if (!arrastrando) return; moverPieza(arrastrando, {tipo:'fila', ancla: b.dataset.ancla === '' ? null : ps[+b.dataset.ancla]}); };
  });
}

/** Debajo del armado: los datos de la foto elegida. */
function pintarDetallePieza(){
  const el = $('pzDetalle'); if (!el) return;
  const ps = cur.piezas || [], p = ps[piezaSel]; if (!p) { el.innerHTML = ''; return; }
  const k = piezaSel, dis = editable() ? '' : 'disabled';
  const fila = filasDePiezas().find(f => f.includes(p));
  const m = prep?.piezas?.[k]?.medidas;
  el.innerHTML = `<div class="detalle-pz">
    <div class="meta"><strong>Pieza ${k + 1}</strong> · ${esc(p.archivo)} · <span id="pzMed${k}">${m ? m.ancho + '×' + m.alto + 'px' : '…'}</span> · ${Math.round((p.bytes || 0) / 1024)} KB${fila.length > 1 ? ` · <span class="fila-tag">fila de ${fila.length}</span>` : ''}</div>
    <label class="lb" for="pzLink">Link</label>
    <input class="inp" id="pzLink" placeholder="https://… (vacío = sin link)" value="${esc(p.link || '')}" ${dis}>
    <label class="lb" for="pzAlt"><span>Texto alternativo</span><span class="cnt">opcional: si no, va el asunto</span></label>
    <input class="inp" id="pzAlt" value="${esc(p.alt || '')}" ${dis}>
    ${editable() ? `<div class="acciones">
      <button class="bt sm" id="pzAntes" ${k ? '' : 'disabled'}>◀ Mover antes</button>
      <button class="bt sm" id="pzDespues" ${k < ps.length - 1 ? '' : 'disabled'}>Mover después ▶</button>
      ${fila.length > 1 ? '<button class="bt sm" id="pzSola">Sacar a su propia fila</button>' : ''}
      <button class="bt sm danger" id="pzQuitar">Quitar</button></div>` : ''}
  </div>`;
  if (!editable()) return;
  $('pzLink').oninput = () => {
    p.link = $('pzLink').value.trim();
    const tile = document.querySelector(`.tile[data-k="${k}"]`);
    if (tile) { const sin = tile.querySelector('.tile-sin'); if (p.link && sin) sin.remove(); if (!p.link && !sin) tile.insertAdjacentHTML('beforeend', '<span class="tile-sin">sin link</span>'); }
    recalcularPronto(); programarGuardado();
  };
  $('pzAlt').oninput = () => { p.alt = $('pzAlt').value; recalcularPronto(); programarGuardado(); };
  // Mover antes / después: cambia la foto de lugar y la forma de las filas queda igual.
  const cambiar = d => { const a = cur.piezas, j = k + d; const ja = a[k].junto, jb = a[j].junto; [a[k], a[j]] = [a[j], a[k]]; a[k].junto = ja; a[j].junto = jb; piezaSel = j; cambioArmado(); };
  $('pzAntes').onclick = () => cambiar(-1);
  $('pzDespues').onclick = () => cambiar(1);
  // Queda sola, justo debajo de la fila en la que estaba.
  if ($('pzSola')) $('pzSola').onclick = () => { const filas = filasDePiezas(); const i = filas.findIndex(f => f.includes(p)); moverPieza(p, {tipo:'fila', ancla: filas[i + 1]?.[0] || null}); };
  $('pzQuitar').onclick = () => { cur.piezas.splice(k, 1); if (cur.piezas[0]) cur.piezas[0].junto = false; piezaSel = Math.max(0, k - 1); cambioArmado(); };
}

/** Placeholders tipo {{LINK_HERO}} del HTML de Atlas → un campo de URL por cada uno. */
function pintarPlaceholders(){
  const el = $('linksPh'); if (!el) return;
  const encontrados = [...new Set([...(cur.html || '').matchAll(/href\s*=\s*["'](\{\{\s*[A-Z0-9_]+\s*\}\})["']/gi)].map(m => m[1]))];
  const actuales = (cur.input?.links || []);
  if (!encontrados.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<label class="lb">Links de la pieza</label>` + encontrados.map(ph => `<div class="row2" style="margin-bottom:6px"><code style="align-self:center">${esc(ph)}</code><input class="inp" data-ph="${esc(ph)}" placeholder="https://…" value="${esc(actuales.find(l => l.buscar === ph)?.url || '')}" ${editable() ? '' : 'disabled'}></div>`).join('');
  el.querySelectorAll('[data-ph]').forEach(x => x.oninput = () => {
    const links = (cur.input?.links || []).filter(l => l.buscar !== x.dataset.ph);
    if (x.value.trim()) links.push({buscar:x.dataset.ph, url:x.value.trim()});
    cur.input = {...cur.input, links}; recalcular(); programarGuardado();
  });
}

  } else {

  if ($('aImpl')) $('aImpl').onclick = e => implementar('armar', e.target);
  if ($('aProg')) $('aProg').onclick = e => implementar('programar', e.target);
  if ($('aCancelar')) $('aCancelar').onclick = () => abrirModal(`<h3>Cancelar news</h3><p class="muted">Queda en el registro y no se puede editar más.</p><div class="ft"><button class="bt" data-cerrar>Volver</button><button class="btn-pri" id="okCancelar">Cancelar news</button></div>`, () => $('okCancelar').onclick = () => { cerrarModal(); cambiarEstado('cancelada'); });
  pintarRegistro();
}

/** En la demo cambia las URLs de ejemplo por las imágenes reales (data:) para verlas en la vista previa. */
function htmlParaPrevia(){
  if (!api.demo) return prep.htmlFinal;
  let h = prep.htmlFinal;
  for (const p of cur.piezas || []) { const b = CACHE_BYTES.get(p.url); if (b) h = h.split(`https://demo.we-are.local/${p.archivo}`).join('data:image/png;base64,' + btoa(Array.from(b, c => String.fromCharCode(c)).join(''))); }

/** Lo que se persiste: la fila con el resultado de la preparación. */
function filaParaGuardar(){
  const hs = prep ? prep.hallazgos : (errPrep || []);
  return {
    nombre: cur.nombre, fecha_envio: cur.fecha_envio || null, hora_envio: cur.hora_envio || null, input: {...(cur.input || {}), utmFinal: prep?.utm},
    contenido: cur.contenido, html: cur.contenido === 'html' ? (cur.html || '') : null,
    piezas: (cur.piezas || []).map((p, k) => ({...p, ancho: prep?.piezas?.[k]?.medidas?.ancho, alto: prep?.piezas?.[k]?.medidas?.alto, sha: prep?.piezas?.[k]?.sha})),
    html_final: prep?.htmlFinal || null, huella: prep?.huella || null,
    n_errores: hs.filter(h => h.severidad === 'error').length, n_avisos: hs.filter(h => h.severidad === 'aviso').length,
  };
}

function programarGuardado(){ clearTimeout(timerGuardar); if ($('guardado')) $('guardado').textContent = 'Sin guardar…'; timerGuardar = setTimeout(guardar, 1200); }
async function guardar(extra = {}){
  clearTimeout(timerGuardar); timerGuardar = null;
  const fila = {...filaParaGuardar(), ...extra};
  // Editar con errores una news "lista" la devuelve a borrador (la base no la deja quedar lista con errores).
  if (cur.estado === 'lista' && fila.n_errores && !extra.estado) fila.estado = 'borrador';
  try {
    const antes = cur.estado;
    const n = await api.guardarNews(cur.id, fila);
    Object.assign(cur, {estado:n.estado, aprobado_por:n.aprobado_por, aprobado_at:n.aprobado_at, aprobado_huella:n.aprobado_huella, cargado_por:n.cargado_por, cargado_at:n.cargado_at, id_externo:n.id_externo, implementado_huella:n.implementado_huella, implementado_at:n.implementado_at});
    const i = D.news.findIndex(x => x.id === cur.id); if (i >= 0) D.news[i] = {...D.news[i], ...n};
    if (antes !== n.estado || extra.estado) { pintarLado(); if (['aprobada','cargada'].includes(antes) && n.estado !== antes && !extra.estado) toast('Cambió el contenido: la aprobación se cayó y hay que aprobar de nuevo', true); }
    if ($('guardado')) $('guardado').textContent = 'Guardado ' + new Date().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
    cargarEventos();
    return true;
  } catch (e) { toast('No se guardó: ' + (e.message || e), true); if ($('guardado')) $('guardado').textContent = 'Error al guardar'; return false; }
}

async function cambiarEstado(estado, extra = {}){
  if (await guardar({estado, ...extra})) {
    toast(EST[estado]);
    if (!editable()) { pintarEditor(); recalcular(); }
  }
}

/** Pedido a la extensión por el puente del hub; responde con "<tipo>-respuesta". */
function pedirExtension(tipo, datos, ms = 60000){
  const id = Math.random().toString(36).slice(2);
  return new Promise(res => {
    const oir = e => { if (e.source === window && e.data?.nws === tipo + '-respuesta' && e.data.id === id) { removeEventListener('message', oir); clearTimeout(t); res(e.data); } };
    const t = setTimeout(() => { removeEventListener('message', oir); res({ok:false, error:'La extensión no respondió. Recargá la página y probá de nuevo.'}); }, ms);
    addEventListener('message', oir);
    postMessage({nws:tipo, id, ...datos}, location.origin);
  });
}

/** Elegir fotos de una carpeta o imagen de Drive (las trae la extensión con la sesión de Google de la persona). */
function modalDrive(){
  if (!document.documentElement.dataset.nwsExtension) return modalExtension();
  if (api.demo) return toast('En la demo no se importa de Drive', true);
  const elegidas = new Map();
  abrirModal(`<h3>Importar desde Drive</h3>
    <p class="muted">Pegá el link de la carpeta o de la imagen. Tenés que poder abrirlo con la cuenta de Google de este Chrome.</p>
    <div style="display:flex;gap:8px"><input class="inp" id="dLink" placeholder="https://drive.google.com/drive/folders/…"><button class="btn-pri" id="dBuscar">Buscar</button></div>
    <div id="dRes" style="margin-top:12px;max-height:55vh;overflow:auto"></div>
    <div class="ft"><button class="bt" data-cerrar>Cancelar</button><button class="btn-pri" id="dAgregar" disabled>Agregar</button></div>`);
  $('modal').style.width = '760px';
  const pintarBoton = () => { $('dAgregar').disabled = !elegidas.size; $('dAgregar').textContent = elegidas.size ? `Agregar ${elegidas.size} como pieza${elegidas.size > 1 ? 's' : ''}` : 'Agregar'; };
  const buscar = async (link) => {
    $('dRes').innerHTML = '<p class="muted">Buscando en Drive…</p>';
    const r = await pedirExtension('drive-listar', {link});
    if (!r.ok) { $('dRes').innerHTML = `<p class="cuenta-e">${esc(r.error)}</p>`; return; }
    elegidas.clear(); pintarBoton();
    const carpetas = (r.carpetas || []).map(c => `<button class="chip" data-carp="${esc(c.id)}">📁 ${esc(c.nombre)}</button>`).join(' ');
    const fotos = (r.imagenes || []).map(i => `<label style="display:flex;flex-direction:column;gap:4px;cursor:pointer;border:2px solid transparent;border-radius:8px;padding:4px" data-foto="${esc(i.id)}">
        ${i.miniatura ? `<img src="${i.miniatura}" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--soft)">` : '<div style="aspect-ratio:1;background:var(--soft);border-radius:6px"></div>'}
        <span style="font-size:11.5px;word-break:break-all"><input type="checkbox"> ${esc(i.nombre)}</span></label>`).join('');
    $('dRes').innerHTML = (r.carpeta ? `<p style="font-weight:700;margin:0 0 8px">${esc(r.carpeta)}</p>` : '')
      + (carpetas ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${carpetas}</div>` : '')
      + (fotos ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">${fotos}</div>` : '<p class="muted">No hay imágenes en este link.</p>')
      + (r.recortada ? '<p class="nota">Se muestran las primeras 80 imágenes.</p>' : '');
    $('dRes').querySelectorAll('[data-carp]').forEach(b => b.onclick = () => buscar('https://drive.google.com/drive/folders/' + b.dataset.carp));
    $('dRes').querySelectorAll('[data-foto]').forEach(l => {
      const cb = l.querySelector('input'), info = r.imagenes.find(i => i.id === l.dataset.foto);
      cb.onchange = () => { if (cb.checked) elegidas.set(info.id, info); else elegidas.delete(info.id); l.style.borderColor = cb.checked ? 'var(--acc)' : 'transparent'; pintarBoton(); };
    });
    if ((r.imagenes || []).length === 1 && !(r.carpetas || []).length) { const cb = $('dRes').querySelector('input'); cb.checked = true; cb.onchange(); }
  };
  $('dBuscar').onclick = () => { const v = $('dLink').value.trim(); if (v) buscar(v); };
  $('dLink').onkeydown = e => { if (e.key === 'Enter') $('dBuscar').click(); };
  $('dLink').focus();
  $('dAgregar').onclick = async () => {
    $('dAgregar').disabled = true; $('dAgregar').textContent = 'Bajando de Drive…';
    const files = [];
    for (const info of elegidas.values()) {
      const r = await pedirExtension('drive-descargar', {driveId: info.id}, 120000);
      if (!r.ok) { toast(`${info.nombre}: ${r.error}`, true); continue; }
      const bytes = Uint8Array.from(atob(r.base64), c => c.charCodeAt(0));
      const nombre = /\.(jpe?g|png|gif|webp)$/i.test(r.nombre) ? r.nombre : (info.nombre || r.nombre);
      files.push(new File([bytes], nombre, {type: r.tipo}));
    }
    cerrarModal(); $('modal').style.width = '';
    if (files.length) subirPiezas(files);
  };
}

/** Le pasa la news a la extensión, que abre WoowUp y completa la pantalla. */
async function cargarEnWoowup(btn){
  if (!document.documentElement.dataset.nwsExtension) return modalExtension();
  const cfg = D.configs[cur.marca_id];
  if (!cfg?.cuenta) return toast('Falta la cuenta de WoowUp de este cliente (Clientes)', true);
  btn.disabled = true;
  try {
    if (!(await guardar())) return;
    const news = {
      cuenta: cfg.cuenta, nombre: cur.nombre, asunto: prep.input.asunto, preheader: prep.input.preheader,
      segmentoId: /^\d+$/.test(prep.segmento?.id || '') ? prep.segmento.id : '', segmentoNombre: prep.segmento?.nombre || '',
      fecha: prep.input.envio?.fecha ? fechaCorta(prep.input.envio.fecha) : 'la que corresponda', hora: prep.input.envio?.hora || '', html: prep.htmlFinal,
    };
    const id = Math.random().toString(36).slice(2);
    const r = await new Promise(res => {
      const oir = e => { if (e.source === window && e.data?.nws === 'cargar-respuesta' && e.data.id === id) { removeEventListener('message', oir); res(e.data); } };
      addEventListener('message', oir);
      postMessage({nws:'cargar', id, news}, location.origin);
      setTimeout(() => { removeEventListener('message', oir); res({ok:false, error:'La extensión no respondió. Recargá la página y probá de nuevo.'}); }, 6000);
    });
    if (!r.ok) return toast(r.error || 'No se pudo abrir WoowUp', true);
    toast('Se abrió WoowUp: la extensión está cargando la campaña');
    try { await api.evento(cur, 'enviada a WoowUp', 'Cargada con la extensión: falta el test y programar'); cargarEventos(); } catch {}
  } finally { btn.disabled = false; }
}

async function implementar(accion, btn){
  const texto = btn.textContent; btn.disabled = true; btn.textContent = accion === 'armar' ? 'Cargando en WoowUp…' : 'Programando…';
  try {
    if (accion === 'armar' && !(await guardar())) return;
    const r = await api.implementar(cur.id, accion);
    toast(r.mensaje);
    const n = await api.newsUna(cur.id);
    Object.assign(cur, {estado:n.estado, id_externo:n.id_externo, implementado_huella:n.implementado_huella, implementado_at:n.implementado_at});
    const i = D.news.findIndex(x => x.id === cur.id); if (i >= 0) D.news[i] = {...D.news[i], estado:n.estado};
    pintarLado(); cargarEventos();
  } catch (e) {
    toast(e.message || String(e), true);
  } finally {
    if (btn.isConnected) { btn.disabled = false; btn.textContent = texto; }
  }
}

/** Si pegan la dirección entera de WoowUp, se queda con la cuenta (campaign.woowup.com/<cuenta>/…). */
function cuentaDe(valor){
  const v = (valor || '').trim();
  const m = v.match(/woowup\.com\/([^/?#\s]+)/i);
  return (m ? m[1] : v).replace(/^\/+|\/+$/g, '');
}
